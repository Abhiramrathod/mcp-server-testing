name: Deploy GitHub Pages

on:
  push:
    branches: [ master ]
    paths:
      - 'docs-site/**'
      - '.github/workflows/github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install
      working-directory: docs-site

    - name: Build site
      run: npm run build
      working-directory: docs-site

    - name: Setup JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17

    - name: Build aggregated Javadocs
      run: mvn -B -DskipTests javadoc:aggregate

    - name: Copy Javadocs into site bundle
      run: |
        if [ -d target/site/apidocs ]; then
          mkdir -p docs-site/dist/javadoc
          cp -r target/site/apidocs docs-site/dist/javadoc/
          printf '%s\n' '<!DOCTYPE html>' '<html>' '<head>' '<meta charset="utf-8">' '<meta http-equiv="refresh" content="0; url=apidocs/index.html">' '<title>Javadocs</title>' '</head>' '<body>' '<a href="apidocs/index.html">Open Javadocs</a>' '</body>' '</html>' > docs-site/dist/javadoc/index.html
        else
          echo "No generated apidocs found in target/site/apidocs" && exit 1
        fi

    - name: Setup Pages
      uses: actions/configure-pages@v6

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: './docs-site/dist'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
